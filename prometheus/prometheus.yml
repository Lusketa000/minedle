global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml
  - /etc/prometheus/recording_rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets:
          - "10.20.30.1:9100"
        labels:
          vm: "reverse-proxy"

      - targets:
          - "10.20.30.2:9100"
        labels:
          vm: "frontend"

      - targets:
          - "10.20.30.3:9100"
        labels:
          vm: "backend"

      - targets:
          - "10.20.30.4:9100"
        labels:
          vm: "database"

      - targets:
          - "10.20.30.5:9100"
        labels:
          vm: "prometheus"

  - job_name: "minedle-backend"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "10.20.30.3:8000"
