<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Sweeper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black flex flex-col place-items-center">

    <pre id="ascii-title" class="text-green-500 bg-black pb-20 mt-20 text-xs leading-none overflow-x-auto whitespace-pre select-none"></pre>

    <div id="log-container" class="size-full max-w-6xl max-h-4xl flex flex-col place-items-center pb-4 opacity-0 transition-opacity duration-700">

        <div class="w-full h-screen grid gap-6 shadow-[0_0_10px_rgba(34,197,94,0.5)] border-2 border-green-500">
            <!--last games here-->
        </div>

        <div class="flex justify-between w-full text-xs font-mono text-green-600 px-1 py-4">
            <a href="" class="hover:text-green-400 hover:underline">&gt; PLAY_TODAY_GAME</a>
            <a href="" class="hover:text-green-400 hover:underline">&gt; GUEST_MODE</a>
        </div>
    </div>

    <script>
        const asciiArt = `
        █████         █████████    █████████  ███████████      █████████    █████████   ██████   ██████ ██████████  █████████ 
        ░███         ███░░░░░███  ███░░░░░███░█░░░███░░░█     ███░░░░░███  ███░░░░░███ ░░██████ ██████ ░░███░░░░░█ ███░░░░░███
        ░███        ░███    ░███ ░███    ░░░ ░   ░███  ░     ███     ░░░  ░███    ░███  ░███░█████░███  ░███  █ ░ ░███    ░░░ 
        ░███        ░███████████ ░░█████████     ░███       ░███          ░███████████  ░███░░███ ░███  ░██████   ░░█████████ 
        ░███        ░███░░░░░███  ░░░░░░░░███    ░███       ░███    █████ ░███░░░░░███  ░███ ░░░  ░███  ░███░░█    ░░░░░░░░███
        ░███      █ ░███    ░███  ███    ░███    ░███       ░░███  ░░███  ░███    ░███  ░███      ░███  ░███ ░   █ ███    ░███
        ███████████ █████   █████░░█████████     █████       ░░█████████  █████   █████ █████     █████ ██████████░░█████████ 
        ░░░░░░░░░░░ ░░░░░   ░░░░░  ░░░░░░░░░     ░░░░░         ░░░░░░░░░  ░░░░░   ░░░░░ ░░░░░     ░░░░░ ░░░░░░░░░░  ░░░░░░░░░  `;

        const lines = asciiArt.split('\n');
        const titleContainer = document.getElementById('ascii-title');
        const logContainer = document.getElementById('log-container');
        
        let currentLine = 0;
        const lineDelay = 65; // Speed per line (ms)

        function printLine() {
            if (currentLine < lines.length) {
                titleContainer.textContent += lines[currentLine] + '\n';
                currentLine++;
                setTimeout(printLine, lineDelay);
            } else {
                // Reveal the form after ASCII art prints
                logContainer.classList.remove('opacity-0');
            }
        }

        window.addEventListener('DOMContentLoaded', printLine);
    </script>
</body>
</html>
